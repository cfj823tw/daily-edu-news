name: Daily Education News

on:
  schedule:
    # 每天上午10點 UTC (需要根據時區調整)
    # 如果需要北京時間(UTC+8) 的10點，應設置為 02:00 UTC
    - cron: '0 2 * * *'  # UTC 02:00 = 北京時間 10:00
  
  # 允許手動觸發
  workflow_dispatch:

jobs:
  collect-and-send-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Collect education news
        run: |
          python scripts/news_crawler.py
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      
      - name: Send email report
        run: |
          python scripts/send_email.py
        env:
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: crawler-logs
          path: logs/
          retention-days: 30
